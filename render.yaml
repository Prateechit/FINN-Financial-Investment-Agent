services:
  - type: web
    name: finn-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn finn.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FINN_INGEST_TOKEN
        generateValue: true
      - key: FINN_CORS_ORIGINS
        value: "*"
      - key: FINN_CACHE_DIR
        value: /tmp/finn-cache
